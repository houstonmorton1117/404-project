<!-- Admin Login Page - Created by David Jackson 4/18/26, Showtime theatrical redesign by Houston Morton -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtime | Admin Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }

        .stage {
            width: 100vw; height: 100vh;
            background:
                radial-gradient(ellipse 55% 45% at 50% 32%, rgba(255, 244, 214, 0.10), transparent 70%),
                var(--stage-bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ticket-card {
            padding: 42px 40px;
            width: 360px;
            text-align: center;
            z-index: 5;
        }

        .ticket-card h2 {
            font-size: 2.2rem;
            margin: 0 0 6px;
            color: var(--navy-deep);
        }
        .ticket-card .kicker {
            color: var(--gold);
            background: var(--ink);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .submit-btn { width: 100%; margin-top: 6px; }

        .footer-links {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }
        .footer-links a {
            color: rgba(34, 26, 22, 0.55);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--navy-deep); }
    </style>
</head>
<body>
    <div class="stage">
        <div class="card-stage ticket-card">
            <span class="kicker">Staff Only</span>
            <h2 class="marquee-title">ADMIN ACCESS</h2>

            <form action="{{ url_for('auth.admin_login') }}" method="POST">
                <!-- CSRF protection added by Rochele Solmon -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field-group">
                    <label>Admin Username</label>
                    <input type="text" name="username" required placeholder="admin" autofocus>
                </div>
                <div class="field-group">
                    <label>Admin Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn btn-ticket">Authorize</button>
            </form>

            <div class="footer-links">
                <a href="{{ url_for('auth.login') }}">&larr; User Login</a>
                <a href="{{ url_for('index') }}">Portal</a>
            </div>
        </div>
    </div>
</body>
</html>
