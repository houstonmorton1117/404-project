<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitemap | Showtime</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/create_storefront.css') }}">
    <style>
        .back-row {
            width: min(1200px, 92%);
            margin: 0 auto 0.8rem;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(10,24,48,0.55);
            border: 1px solid rgba(212,175,55,0.5);
            border-radius: 999px;
            color: #d4af37;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 6px 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .back-btn:hover {
            background: rgba(212,175,55,0.15);
            color: #f0cc55;
        }
        .sitemap-body {
            width: min(760px, 92%);
            margin: 1.5rem auto 3rem;
        }
        .sitemap-group { margin-bottom: 2rem; }
        .sitemap-group h3 {
            color: #f0cc55;
            font-size: 1rem;
            margin: 0 0 0.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(212,175,55,0.3);
            padding-bottom: 0.4rem;
        }
        .sitemap-group ul { list-style: none; margin: 0; padding: 0; }
        .sitemap-group li { margin: 0.4rem 0; }
        .sitemap-group a {
            color: #e9e3d4;
            text-decoration: none;
            font-size: 0.95rem;
        }
        .sitemap-group a:hover { color: #f0cc55; text-decoration: underline; }
    </style>
</head>
<body>
    <div class="back-row">
        <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </button>
    </div>

    <header class="create-header">
        <div class="brand-block">
            <h1 class="brand-title"><span class="gold">Show</span>time</h1>
            <p class="brand-subtitle">Fashion Marketplace</p>
        </div>
        <h2 class="page-title">Sitemap</h2>
    </header>

    <main class="sitemap-body">
        <div class="sitemap-group">
            <h3>Shop</h3>
            <ul>
                <li><a href="{{ url_for('storefront_pages_bp.storefront_home_page') }}">All Storefronts</a></li>
                <li><a href="{{ url_for('auth.view_cart') }}">Your Bag</a></li>
                <li><a href="{{ url_for('auth.account') }}">Account</a></li>
                <li><a href="{{ url_for('returns_bp.returns_page') }}">Returns</a></li>
            </ul>
        </div>

        <div class="sitemap-group">
            <h3>Sell</h3>
            <ul>
                <li><a href="{{ url_for('storefront_pages_bp.create_storefront_page') }}">Create Storefront</a></li>
                <li><a href="{{ url_for('storefront_pages_bp.my_storefront_page') }}">My Storefront</a></li>
                <li><a href="{{ url_for('create_listing') }}">Create Listing</a></li>
            </ul>
        </div>

        <div class="sitemap-group">
            <h3>Account</h3>
            <ul>
                <li><a href="{{ url_for('auth.login') }}">Log In</a></li>
                <li><a href="{{ url_for('auth.signup') }}">Sign Up</a></li>
                <li><a href="{{ url_for('auth.logout') }}">Log Out</a></li>
            </ul>
        </div>

        <div class="sitemap-group">
            <h3>About</h3>
            <ul>
                <li><a href="{{ url_for('storefront_pages_bp.about_page') }}">About Showtime</a></li>
            </ul>
        </div>
    </main>

    <script>
        document.getElementById("backBtn").addEventListener("click", () => {
            window.location.href = "/storefronts";
        });
    </script>
</body>
</html>
