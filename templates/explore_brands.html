
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Showtime | Explore Brands</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='css/storefront.css') }}">

  <style>
    .explore-container {
      max-width: 1200px;
      margin: 35px auto;
      padding: 0 25px 60px;
      color: white;
    }

    .explore-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 35px;
    }

    .explore-heading {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 800;
      font-style: italic;
      color: white;
    }

    .back-link {
      display: inline-block;
      color: #e0ad24;
      border: 1px solid #e0ad24;
      border-radius: 25px;
      padding: 10px 20px;
      text-decoration: none;
      font-weight: bold;
    }

    .back-link:hover {
      background: #e0ad24;
      color: #0b1d3b;
    }

    .explore-intro {
      background: rgba(5, 17, 39, 0.9);
      border: 1px solid #b88b19;
      padding: 30px;
      margin-bottom: 35px;
    }

    .explore-intro h2 {
      color: #e0ad24;
      font-size: 24px;
      margin-bottom: 12px;
    }

    .explore-intro p {
      color: #e0e4ed;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .brand-search {
      width: 100%;
      padding: 15px 20px;
      border: 1px solid #b88b19;
      border-radius: 30px;
      background: #1b2e4e;
      color: white;
      font-size: 16px;
      box-sizing: border-box;
    }

    .brand-search::placeholder {
      color: #aeb8c9;
    }

    .brand-results-title {
      color: #e0ad24;
      font-size: 22px;
      margin-bottom: 20px;
    }

    .explore-container .storefront-grid {
      margin-top: 15px;
    }

    .empty-message {
      color: #cbd3e0;
      text-align: center;
      padding: 35px;
    }

    @media (max-width: 650px) {
      .explore-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .explore-intro {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

  <main class="explore-container">

    <a href="{{ url_for('storefront_pages_bp.storefront_home_page') }}"
       class="back-link">
      &#8249; BACK TO STOREFRONT
    </a>

    <div class="explore-header">
      <div>
        <h1 class="brand-title">
          <span class="gold">Show</span>time
        </h1>
        <p class="brand-subtitle">Fashion Marketplace</p>
      </div>

      <h2 class="explore-heading">Explore Brands</h2>
    </div>

    <section class="explore-intro">
      <h2>DISCOVER STUDENT BRANDS</h2>
      <p>
        Explore fashion brands created by Hampton University
        students. Discover new styles, support student
        entrepreneurs, and find your next favorite storefront.
      </p>

      <input
        type="search"
        id="searchInput"
        class="brand-search"
        placeholder="Search student brands..."
        aria-label="Search student brands"
      >
    </section>

    <section class="brands-section">
      <h2 class="brand-results-title">ALL BRANDS</h2>

      <div class="storefront-grid" id="storefrontGrid"></div>

      <p id="emptyMessage" class="empty-message" hidden>
        No brands found.
      </p>

      <div class="pagination">
        <button class="page-btn">Previous</button>
        <span class="page-indicator">Page 1</span>
        <button class="page-btn">Next</button>
      </div>
    </section>

  </main>

  <div id="lightboxOverlay" class="lightbox-overlay">
    <img id="lightboxImg" class="lightbox-img"
         src="" alt="Storefront preview">
  </div>

  <script src="{{ url_for('static', filename='js/storefront.js') }}"></script>

</body>
</html>
