<!-- Created 3/21/2026 by Ryan Grimes, Showtime theatrical redesign by Houston Morton -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtime | Reserve a Seat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }

        .stage {
            width: 100vw; height: 100vh;
            background:
                radial-gradient(ellipse 55% 45% at 50% 32%, rgba(255, 244, 214, 0.10), transparent 70%),
                var(--stage-bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ticket-card {
            padding: 40px 38px;
            width: 360px;
            text-align: center;
            z-index: 5;
        }

        .ticket-card h2 {
            font-size: 2.2rem;
            margin: 0 0 6px;
            color: var(--navy-deep);
        }
        .ticket-card .kicker {
            color: var(--gold);
            background: var(--ink);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .submit-btn { width: 100%; margin-top: 6px; }

        .back-link {
            display: block;
            margin-top: 20px;
            color: rgba(34, 26, 22, 0.55);
            font-size: 0.75rem;
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
        }
        .back-link:hover { color: var(--navy-deep); }
    </style>
</head>
<body>
    <div class="stage">
        <div class="card-stage ticket-card">
            <span class="kicker">Will Call</span>
            <h2 class="marquee-title">CREATE YOUR ACCOUNT</h2>

            <form action="{{ url_for('auth.signup') }}" method="POST">
                <!-- CSRF protection added by Rochele Solmon -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="User_01">
                </div>
                <div class="field-group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="email@example.com">
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn btn-ticket">Join the Show</button>
            </form>
            <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Lobby</a>
        </div>
    </div>
</body>
</html>
