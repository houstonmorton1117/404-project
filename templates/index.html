<!-- Created 3/19/2026 by Ryan Grimes, Showtime theatrical redesign by Houston Morton -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtime | Portal</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        html, body {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden;
        }

        .stage {
            position: relative;
            width: 100vw;
            height: 100vh;
            background:
                radial-gradient(ellipse 60% 45% at 50% 38%, rgba(255, 244, 214, 0.10), transparent 70%),
                var(--stage-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .portal-header {
            position: absolute;
            top: 6vh;
            color: var(--gold-dim);
            font-size: 1.5vh;
            font-style: italic;
            letter-spacing: 3px;
            text-transform: uppercase;
            z-index: 5;
        }

        /* Two searchlight beams crossing behind the title, like spotlights
           sweeping the sky above a premiere. */
        .searchlights {
            position: absolute;
            top: 2vh;
            left: 50%;
            width: 0;
            height: 0;
            z-index: 1;
            pointer-events: none;
        }

        .beam {
            position: absolute;
            top: 0;
            left: 0;
            width: 240px;
            height: 56vh;
            background: linear-gradient(180deg, rgba(206, 176, 78, 0) 0%, rgba(206, 176, 78, 0.22) 55%, rgba(206, 176, 78, 0) 100%);
            clip-path: polygon(48% 0%, 52% 0%, 100% 100%, 0% 100%);
            transform-origin: top center;
            mix-blend-mode: screen;
        }

        .beam-left { transform: translateX(-100%) rotate(-13deg); }
        .beam-right { transform: translateX(0%) rotate(13deg); }

        .marquee-wrap {
            position: relative;
            text-align: center;
            z-index: 5;
        }

        .main-title {
            font-size: 11vh;
            line-height: 0.85;
            margin: 0;
            background: linear-gradient(180deg, var(--gold-bright), var(--gold) 55%, #9a7a1f);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 40px rgba(212, 175, 55, 0.35);
        }

        .sub-title {
            color: var(--cream);
            opacity: 0.85;
            font-size: 2.2vh;
            margin-top: 1vh;
            letter-spacing: 5px;
            font-family: 'Inter', sans-serif;
        }

        .button-row {
            display: flex;
            justify-content: center;
            gap: 4vw;
            margin-top: 5vh;
            z-index: 5;
        }

    </style>
</head>
<body>
    <div class="stage">
        <div class="portal-header">You have arrived at the portal to...</div>

        <div class="searchlights" aria-hidden="true">
            <span class="beam beam-left"></span>
            <span class="beam beam-right"></span>
        </div>

        <div class="marquee-wrap spotlight-glow">
            <h1 class="main-title marquee-title">SHOWTIME</h1>
            <div class="sub-title">FASHION MARKETPLACE</div>
        </div>

        <div class="button-row">
            <a href="{{ url_for('auth.login') }}" class="btn-ticket">Log In</a>
            <a href="{{ url_for('auth.signup') }}" class="btn-ticket-outline">Sign Up</a>
        </div>
    </div>
</body>
</html>
