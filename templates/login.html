<!-- Created 3/21/2026 by Ryan Grimes, Showtime theatrical redesign by Houston Morton -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showtime | Box Office</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }

        .stage {
            width: 100vw; height: 100vh;
            background:
                radial-gradient(ellipse 55% 45% at 50% 32%, rgba(255, 244, 214, 0.10), transparent 70%),
                var(--stage-bg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .ticket-card {
            padding: 42px 40px;
            width: 360px;
            text-align: center;
            z-index: 5;
        }

        .ticket-card h2 {
            font-size: 2.4rem;
            margin: 0 0 6px;
            color: var(--navy-deep);
        }
        .ticket-card .kicker {
            color: var(--gold);
            background: var(--ink);
            display: inline-block;
            padding: 3px 10px;
            border-radius: 2px;
            font-size: 0.68rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            margin-bottom: 18px;
        }

        .ticket-divider {
            border: none;
            border-top: 2px dashed rgba(34, 26, 22, 0.2);
            margin: 24px 0;
        }

        .submit-btn {
            width: 100%;
            margin-top: 6px;
        }

        .footer-links {
            margin-top: 22px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }
        .footer-links a {
            color: rgba(34, 26, 22, 0.55);
            text-decoration: none;
            font-family: 'Inter', sans-serif;
            transition: color 0.2s;
        }
        .footer-links a:hover { color: var(--navy-deep); }

        .admin-btn {
            display: inline-block;
            margin-top: 18px;
            padding: 8px 18px;
            border: 1px solid rgba(34, 26, 22, 0.25);
            color: rgba(34, 26, 22, 0.6);
            text-decoration: none;
            font-size: 0.68rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            border-radius: 3px;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background: var(--ink);
            color: var(--gold-bright);
            border-color: var(--ink);
        }
    </style>
</head>
<body>
    <div class="stage">
        <div class="card-stage ticket-card">
            <span class="kicker">Box Office</span>
            <h2 class="marquee-title">WELCOME BACK</h2>

            <form action="{{ url_for('auth.login') }}" method="POST">
                <!-- CSRF protection added by Rochele Solmon -->
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div class="field-group">
                    <label>Username</label>
                    <input type="text" name="username" required placeholder="User_01" autofocus>
                </div>
                <div class="field-group">
                    <label>Password</label>
                    <input type="password" name="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="submit-btn btn-ticket">Enter the Show</button>
            </form>

            <div class="footer-links">
                <a href="{{ url_for('index') }}">&larr; Back to Lobby</a>
                <a href="{{ url_for('auth.signup') }}">Reserve a Seat</a>
            </div>

            <hr class="ticket-divider">

            <!-- Admin Login Button added by David Jackson 4/20/26 -->
            <a href="{{ url_for('auth.admin_login') }}" class="admin-btn">
                Staff Entrance
            </a>
        </div>
    </div>
</body>
</html>
